<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Usta Hisob">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/usta-hisob-192.png">
<title>Usta Hisob — Beton kalkulyatori</title>
<style>
  :root { color-scheme: light; --green:#174a35; --bg:#f3f6f4; --card:#fff; --muted:#607067; --line:#dce5df; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:#17231c; }
  main { max-width:560px; margin:0 auto; padding:22px 16px 40px; }
  header { display:flex; align-items:center; gap:13px; margin-bottom:20px; }
  .logo { width:58px; height:58px; display:grid; place-items:center; border-radius:16px; background:var(--green); color:#fff; font-size:28px; font-weight:800; }
  h1 { font-size:24px; margin:0 0 4px; } .subtitle { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 4px 18px #163a2410; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
  h2 { font-size:19px; margin:0; }
  select, input, button { font:inherit; }
  select { border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; }
  label { display:block; font-size:14px; font-weight:650; margin:14px 0 7px; }
  input { width:100%; padding:12px; border:1px solid #cbd8cf; border-radius:10px; background:#fff; }
  input:focus, select:focus { outline:2px solid #83b69a; outline-offset:1px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .reserve { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .reserve label { display:flex; align-items:center; gap:6px; margin:0; padding:9px 11px; border:1px solid var(--line); border-radius:10px; font-weight:500; cursor:pointer; }
  .reserve input { width:auto; margin:0; }
  button { width:100%; margin-top:20px; padding:13px 16px; border:0; border-radius:11px; color:white; background:var(--green); font-weight:750; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  #result { display:none; margin-top:16px; padding:17px; border-radius:14px; background:#eaf4ed; }
  #result .caption { font-size:13px; color:#466452; }
  #total { font-size:32px; line-height:1.25; font-weight:800; color:var(--green); margin:6px 0 10px; overflow-wrap:anywhere; }
  #details { font-size:14px; line-height:1.7; }
  #error { color:#a32222; font-size:13px; margin-top:12px; display:none; }
  .note { color:var(--muted); font-size:12px; line-height:1.5; margin-top:16px; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
  @media(max-width:380px) { .card { padding:15px; } .grid { gap:8px; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">UH</div>
    <div>
      <h1>Usta Hisob</h1>
      <div class="subtitle" id="tagline">Qurilish hisob-kitoblari</div>
    </div>
  </header>
  <section class="card">
    <div class="top">
      <h2 id="heading">Beton kalkulyatori</h2>
      <select id="language" aria-label="Language">
        <option value="uz">O‘zbekcha</option>
        <option value="ru">Русский</option>
      </select>
    </div>
    <label id="lengthLabel" for="length">Uzunlik (metr)</label>
    <input id="length" type="number" min="0.0001" step="any" value="60" inputmode="decimal">
    <div class="grid">
      <div>
        <label id="widthLabel" for="width">Eni (metr)</label>
        <input id="width" type="number" min="0.0001" step="any" value="0.4" inputmode="decimal">
      </div>
      <div>
        <label id="heightLabel" for="height">Balandligi (metr)</label>
        <input id="height" type="number" min="0.0001" step="any" value="0.5" inputmode="decimal">
      </div>
    </div>
    <label id="reserveLabel">Qo‘shimcha zaxira</label>
    <div class="reserve">
      <label><input type="radio" name="reserve" value="0" checked> 0%</label>
      <label><input type="radio" name="reserve" value="3"> 3%</label>
      <label><input type="radio" name="reserve" value="5"> 5%</label>
      <label><input type="radio" name="reserve" value="10"> 10%</label>
    </div>
    <button id="calculate">Beton hajmini hisoblash</button>
    <div id="error" role="alert"></div>
    <div id="result" aria-live="polite">
      <div class="caption" id="resultLabel">Kerakli beton hajmi</div>
      <div id="total">12 m³</div>
      <div id="details"></div>
    </div>
    <div class="note" id="note">Hisob uzunlik × eni × balandlik formulasi asosida bajariladi. Buyurtmadan oldin loyiha va maydondagi o‘lchamlarni tekshiring.</div>
  </section>
  <footer>Usta Hisob · 1.0 · <span id="footerText">Dastlabki bepul prototip</span></footer>
</main>
<script>
const words = {
  uz: {
    tagline:"Qurilish hisob-kitoblari", heading:"Beton kalkulyatori",
    length:"Uzunlik (metr)", width:"Eni (metr)", height:"Balandligi (metr)",
    reserve:"Qo‘shimcha zaxira", calculate:"Beton hajmini hisoblash",
    result:"Kerakli beton hajmi", base:"Asosiy hajm", extra:"Zaxira miqdori",
    error:"Iltimos, uzunlik, eni va balandlikni noldan katta sonlarda kiriting.",
    note:"Hisob uzunlik × eni × balandlik formulasi asosida bajariladi. Buyurtmadan oldin loyiha va maydondagi o‘lchamlarni tekshiring.",
    footer:"Dastlabki bepul prototip"
  },
  ru: {
    tagline:"Строительные расчёты", heading:"Калькулятор бетона",
    length:"Длина (метры)", width:"Ширина (метры)", height:"Высота (метры)",
    reserve:"Дополнительный запас", calculate:"Рассчитать объём бетона",
    result:"Необходимый объём бетона", base:"Основной объём", extra:"Запас",
    error:"Введите длину, ширину и высоту числами больше нуля.",
    note:"Расчёт выполнен по формуле длина × ширина × высота. Перед заказом проверьте проект и фактические размеры на объекте.",
    footer:"Первый бесплатный прототип"
  }
};
const $ = id => document.getElementById(id);
function setLanguage() {
  const t = words[$("language").value];
  $("tagline").textContent=t.tagline; $("heading").textContent=t.heading;
  $("lengthLabel").textContent=t.length; $("widthLabel").textContent=t.width;
  $("heightLabel").textContent=t.height; $("reserveLabel").textContent=t.reserve;
  $("calculate").textContent=t.calculate; $("resultLabel").textContent=t.result;
  $("note").textContent=t.note; $("footerText").textContent=t.footer;
  $("error").style.display="none"; $("result").style.display="none";
}
function fmt(n) {
  return new Intl.NumberFormat($("language").value==="ru"?"ru-RU":"uz-UZ",{maximumFractionDigits:3}).format(n);
}
function calculate() {
  const t=words[$("language").value];
  const l=Number($("length").value), w=Number($("width").value), h=Number($("height").value);
  $("error").style.display="none"; $("result").style.display="none";
  if (![$("length").value,$("width").value,$("height").value].every(v=>v.trim()!=="" && Number.isFinite(Number(v)) && Number(v)>0)) {
    $("error").textContent=t.error; $("error").style.display="block"; return;
  }
  const base=l*w*h;
  const reserve=Number(document.querySelector('input[name="reserve"]:checked').value);
  const total=base*(1+reserve/100);
  $("total").textContent=fmt(total)+" m³";
  $("details").textContent=`${t.base}: ${fmt(base)} m³`+(reserve ? ` · ${t.extra}: ${fmt(total-base)} m³ (${reserve}%)` : "");
  $("result").style.display="block";
}
$("language").addEventListener("change",setLanguage);
$("calculate").addEventListener("click",calculate);
setLanguage();
calculate();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
